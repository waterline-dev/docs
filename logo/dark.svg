<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 36" width="200" height="36">
  <defs>
    <clipPath id="icon-clip-d">
      <rect x="0" y="2" width="32" height="32" rx="7" ry="7"/>
    </clipPath>
  </defs>
  <!-- Icon: rounded rect waterline mark -->
  <rect x="0" y="2" width="32" height="32" rx="7" ry="7" fill="#14532d"/>
  <rect x="0" y="18" width="32" height="16" fill="#16a34a" clip-path="url(#icon-clip-d)"/>
  <!-- Waterline stroke -->
  <line x1="0" y1="18" x2="32" y2="18" stroke="#22c55e" stroke-width="1.5" clip-path="url(#icon-clip-d)"/>
  <!-- Wordmark: single text, no tspan -->
  <text x="42" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#f5f5f4">Waterline</text>
</svg>
